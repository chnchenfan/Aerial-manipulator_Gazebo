# 关节状态发布器 (必须保留)
joint_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: 100

# 关节1：基座旋转
arm_joint1_position_controller:
  type: effort_controllers/JointPositionController
  joint: arm_joint1
  pid:
    p: 8.0
    i: 0.05
    d: 0.5
    i_clamp_min: -0.5
    i_clamp_max: 0.5

# 关节2：主臂俯仰
arm_joint2_position_controller:
  type: effort_controllers/JointPositionController
  joint: arm_joint2
  pid:
    p: 12
    i: 0.2
    d: 0.5
    i_clamp_min: -0.5
    i_clamp_max: 0.5

# 左夹爪滑块
left_hand_joint_position_controller:
  type: effort_controllers/JointPositionController
  joint: left_hand_joint
  pid:
    p: 0.8
    i: 0.0
    d: 0.02
    i_clamp_min: -0.02
    i_clamp_max: 0.02
  command_limits:
    min: -0.01
    max: 0.01
